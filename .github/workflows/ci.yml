name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/dev-shell
      - name: Check formatting
        run: nix develop -c knave fmt --check .
      - name: Run tests
        run: nix develop -c knave test .
      - name: Check that the landing sample matches the emitted Rust
        run: "! nix develop -c bash -c 'grep -vxFf <(knave emit content/sample.rslisp) content/sample.rs'"
      - name: Build the site
        run: nix develop -c bash -c 'knave build && target/knave/knave-site/knave-site'
