name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/dev-shell
      - name: Check formatting
        run: nix develop -c knave fmt --check
      - name: Run tests
        run: nix develop -c knave test
      - name: Check that the landing sample matches the emitted Rust
        run: |
          nix develop -c bash -c '
            knave emit content/sample.rslisp |
              sed "/^mod rt/,\$d; /^#\[derive/d; /restore_default_sigpipe/d" |
              sed -e :a -e "/^\n*\$/{\$d;N;ba" -e "}" |
              diff - content/sample.rs'
      - name: Build the site
        run: nix develop -c bash -c 'knave build && target/knave/knave-site/knave-site'
