name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/dev-shell
      - name: Fetch libraries so the formatter can read their shapes
        run: nix develop -c knave check
      - name: Check formatting
        run: nix develop -c knave fmt --check
      - name: Run tests
        run: nix develop -c knave test
      - name: Check that the landing sample matches the emitted Rust
        run: |
          nix develop -c bash -c '
            knave emit content/sample.knv |
              sed "/^mod rt/,\$d; /^#\[derive/d; /restore_default_sigpipe/d" |
              sed -e :a -e "/^\n*\$/{\$d;N;ba" -e "}" |
              diff - content/sample.rs'
      - name: Build the site
        run: nix develop -c knave task build
      - name: Check that body text sits on the baseline grid in Chromium and Firefox
        run: |
          nix develop -c npm ci --prefix browser-checks
          nix develop -c node browser-checks/baselines.mjs public chromium firefox
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public

  baselines:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright's WebKit
        working-directory: browser-checks
        run: |
          npm ci
          npx playwright install webkit
      - name: Check that body text sits on the baseline grid in WebKit on macOS
        run: node browser-checks/baselines.mjs public webkit
